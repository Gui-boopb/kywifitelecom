<!DOCTYPE html>
<html lang="pt-BR">
<head>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central de Acesso | Ky WIFI Telecom</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --purple-main: #6A1B9A;
      --purple-dark: #4A148C;
      --accent-orange: #FF6D00;
      --text-dark: #121826;
      --text-muted: #64748B;
      --bg-gradient: linear-gradient(135deg, #4A148C 0%, #1A237E 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    body { background: var(--bg-gradient); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }

    .card-login { background: #FFFFFF; width: 100%; max-width: 420px; padding: 32px 32px 40px; border-radius: 16px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25); position: relative; }
    
    .btn-back-top { display: inline-flex; align-items: center; gap: 8px; color: var(--purple-main); font-size: 0.875rem; font-weight: 600; text-decoration: none; margin-bottom: 20px; transition: color 0.2s ease; }
    .btn-back-top:hover { color: var(--purple-dark); text-decoration: underline; }

    .brand-header { text-align: center; margin-bottom: 30px; }
    .brand-logo { height: 55px; margin-bottom: 12px; object-fit: contain; }
    .brand-header h1 { color: var(--purple-dark); font-family: 'Poppins', sans-serif; font-size: 1.6rem; font-weight: 700; }
    .brand-header p { color: var(--text-muted); font-size: 0.9rem; margin-top: 4px; }

    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; color: #334155; font-size: 0.875rem; font-weight: 600; margin-bottom: 8px; }
    .input-control { width: 100%; padding: 12px 16px; border: 2px solid #E2E8F0; border-radius: 8px; font-size: 1rem; color: var(--text-dark); outline: none; transition: all 0.25s ease; background: #F8FAFC; }
    .input-control:focus { border-color: var(--purple-main); background: #FFFFFF; box-shadow: 0 0 0 4px rgba(106, 27, 154, 0.12); }

    .forgot-link { display: block; text-align: right; font-size: 0.85rem; color: var(--purple-main); text-decoration: none; font-weight: 600; margin-top: -10px; margin-bottom: 20px; cursor: pointer; }
    .forgot-link:hover { text-decoration: underline; }

    .btn-submit { width: 100%; padding: 14px; background: var(--purple-main); color: #FFFFFF; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.25s ease; box-shadow: 0 4px 12px rgba(106, 27, 154, 0.3); }
    .btn-submit:hover { background: var(--purple-dark); transform: translateY(-1px); }
    .btn-submit:disabled { background: #94A3B8; cursor: not-allowed; transform: none; box-shadow: none; }

    .btn-back-bottom { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--text-muted); font-size: 0.875rem; font-weight: 500; text-decoration: none; margin-top: 20px; transition: color 0.2s ease; }
    .btn-back-bottom:hover { color: var(--purple-main); }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    .modal-card { background: #FFFFFF; border-radius: 16px; padding: 32px 24px; width: 100%; max-width: 420px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); position: relative; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modal-header h2 { font-size: 1.25rem; color: var(--purple-dark); font-family: 'Poppins', sans-serif; }
    .close-btn { background: none; border: none; font-size: 1.25rem; color: var(--text-muted); cursor: pointer; }

    /* ESTILOS DE TOAST */
    #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
    .toast { min-width: 280px; padding: 14px 20px; border-radius: 8px; color: #fff; font-weight: 600; font-size: 0.9rem; box-shadow: 0 5px 15px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 10px; animation: slideIn 0.3s ease-out forwards; }
    .toast-success { background-color: #10B981; }
    .toast-error { background-color: #EF4444; }
    .toast-info { background-color: #2563EB; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes fadeOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(100%); } }
  </style>
</head>
<body>

  <div id="toast-container"></div>

  <div class="card-login">
    
    </a>

    <div class="brand-header">
      <img src="https://i.ibb.co/Xrz7n7dX/image-9658f0-removebg-preview.png" alt="Ky WIFI Telecom" class="brand-logo">
      <h1>Acesso ao Painel</h1>
      <p>Digite seu CPF e senha para entrar</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" class="input-control" placeholder="000.000.000-00" maxlength="14" required autocomplete="off">
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" class="input-control" placeholder="Sua senha de acesso" required>
      </div>

      <a class="forgot-link" onclick="abrirModalRecuperacao()">Esqueceu sua senha?</a>

      <button type="submit" id="btnSubmit" class="btn-submit">Entrar no Sistema</button>
    </form>

    <!-- LINK DE RETORNO (RODAPÉ DO CARD) -->
    <a href="index.html" class="btn-back-bottom">
      <i class="fas fa-arrow-left"></i> Voltar para a Página Inicial
    </a>
  </div>

  <div class="modal-overlay" id="modalRecuperacao">
    <div class="modal-card">
      <div class="modal-header">
        <h2>Recuperar Senha</h2>
        <button class="close-btn" onclick="fecharModalRecuperacao()"><i class="fas fa-times"></i></button>
      </div>

      <form id="formValidacao">
        <p style="font-size: 0.875rem; color: var(--text-muted); margin-bottom: 16px;">
          Informe seu CPF e sua Data de Nascimento para confirmar sua identidade.
        </p>

        <div class="form-group">
          <label for="recCpf">CPF</label>
          <input type="text" id="recCpf" class="input-control" placeholder="000.000.000-00" maxlength="14" required>
        </div>

        <div class="form-group">
          <label for="recDataNasc">Data de Nascimento</label>
          <input type="date" id="recDataNasc" class="input-control" required>
        </div>

        <button type="submit" id="btnValidar" class="btn-submit">Verificar Dados</button>
      </form>

      <form id="formNovaSenha" style="display: none;">
        <p style="font-size: 0.875rem; color: var(--text-muted); margin-bottom: 16px;">
          Identidade confirmada! Digite sua nova senha de acesso.
        </p>

        <div class="form-group">
          <label for="novaSenha">Nova Senha</label>
          <input type="password" id="novaSenha" class="input-control" placeholder="Digite a nova senha" minlength="4" required>
        </div>

        <div class="form-group">
          <label for="confirmaSenha">Confirmar Nova Senha</label>
          <input type="password" id="confirmaSenha" class="input-control" placeholder="Repita a nova senha" minlength="4" required>
        </div>

        <button type="submit" id="btnSalvarSenha" class="btn-submit">Salvar Nova Senha</button>
      </form>
    </div>
  </div>

  <script>
    const firebaseConfig = { databaseURL: "https://ky-wi-fi-telecom-default-rtdb.firebaseio.com/" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function showToast(message, type = 'success', duration = 3500) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      let icon = type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle';
      toast.innerHTML = `<i class="fas ${icon}"></i> <span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.animation = 'fadeOut 0.3s ease-in forwards';
        setTimeout(() => toast.remove(), 300);
      }, duration);
    }

    function aplicarMascaraCPF(input) {
      let value = input.value.replace(/\D/g, '');
      if (value.length > 11) value = value.slice(0, 11);
      value = value.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
      input.value = value;
    }

    document.getElementById('cpf').addEventListener('input', e => aplicarMascaraCPF(e.target));
    document.getElementById('recCpf').addEventListener('input', e => aplicarMascaraCPF(e.target));

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      const cpfLimpo = document.getElementById('cpf').value.replace(/\D/g, '');
      const senhaInput = document.getElementById('senha').value;

      btn.disabled = true;
      btn.innerText = 'Autenticando...';

      try {
        const snapshot = await db.ref(`usuarios/${cpfLimpo}`).once('value');
        const usuario = snapshot.val();

        if (!usuario || usuario.senha !== senhaInput) throw new Error('CPF ou senha incorretos.');
        if (usuario.status && usuario.status !== 'ativo') throw new Error('Usuário inativo. Entre em contato com o suporte.');

        showToast('Acesso liberado! Redirecionando...', 'success');
        localStorage.setItem('usuarioLogado', JSON.stringify(usuario));

        setTimeout(() => {
          window.location.href = (usuario.tipo === 'admin' || usuario.tipo === 'operador') ? 'admin.html' : 'area-do-cliente.html';
        }, 1000);

      } catch (err) {
        showToast(err.message || 'Erro de conexão.', 'error');
        btn.disabled = false;
        btn.innerText = 'Entrar no Sistema';
      }
    });

    let usuarioValidoCpf = '';

    function abrirModalRecuperacao() {
      document.getElementById('modalRecuperacao').style.display = 'flex';
      document.getElementById('formValidacao').style.display = 'block';
      document.getElementById('formNovaSenha').style.display = 'none';
      document.getElementById('formValidacao').reset();
      document.getElementById('formNovaSenha').reset();
    }

    function fecharModalRecuperacao() {
      document.getElementById('modalRecuperacao').style.display = 'none';
    }

    document.getElementById('formValidacao').addEventListener('submit', async function (e) {
      e.preventDefault();
      const btn = document.getElementById('btnValidar');
      const cpfLimpo = document.getElementById('recCpf').value.replace(/\D/g, '');
      const dataNascInput = document.getElementById('recDataNasc').value;

      btn.disabled = true;
      btn.innerText = 'Verificando...';

      try {
        const snapUsuario = await db.ref(`usuarios/${cpfLimpo}`).once('value');
        const usuario = snapUsuario.val();

        const snapCliente = await db.ref(`clientes/${cpfLimpo}`).once('value');
        const cliente = snapCliente.val();

        if (!usuario && !cliente) throw new Error('Usuário/CPF não encontrado no sistema.');

        const dataNascCadastrada = (usuario && usuario.data_nascimento) || (cliente && cliente.data_nascimento);

        if (!dataNascCadastrada || dataNascCadastrada !== dataNascInput) {
          throw new Error('Data de nascimento incorreta ou não confere com o CPF.');
        }

        usuarioValidoCpf = cpfLimpo;
        showToast('Dados confirmados com sucesso!', 'success');
        document.getElementById('formValidacao').style.display = 'none';
        document.getElementById('formNovaSenha').style.display = 'block';

      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Verificar Dados';
      }
    });

    document.getElementById('formNovaSenha').addEventListener('submit', async function (e) {
      e.preventDefault();
      const btn = document.getElementById('btnSalvarSenha');
      const novaSenha = document.getElementById('novaSenha').value;
      const confirmaSenha = document.getElementById('confirmaSenha').value;

      if (novaSenha !== confirmaSenha) {
        showToast('As senhas digitadas não coincidem.', 'error');
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Atualizando...';

      try {
        await db.ref(`usuarios/${usuarioValidoCpf}`).update({ senha: novaSenha });
        showToast('Senha alterada com sucesso! Redirecionando...', 'success');
        setTimeout(() => { fecharModalRecuperacao(); }, 1500);
      } catch (err) {
        showToast('Erro ao atualizar a senha. Tente novamente.', 'error');
        btn.disabled = false;
        btn.innerText = 'Salvar Nova Senha';
      }
    });
  </script>
</body>
</html>
